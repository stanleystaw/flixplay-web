<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lecture</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{ --blue:#2166E5; --green:#1DD171; --bg:#0B0D12; --line:#232837; }
html,body{ height:100%; }
body { background:var(--bg); color:#fff; font-family:"Mulish","Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; }
#bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg); border-bottom:1px solid var(--line); flex:0 0 auto; }
#bar button { background:#14171F; border:1px solid var(--line); color:#fff; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
#title { flex:1; font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#frame { flex:1; width:100%; border:none; background:#000; }
#status { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:12px; color:#C7CDD6; font-size:13.5px; font-weight:700; z-index:5; }
.spin { width:34px; height:34px; border:3px solid #2A3040; border-top-color:var(--green); border-radius:50%; animation:sp 1s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg);} }
#status small { color:#8A919C; font-weight:600; max-width:80%; text-align:center; line-height:1.5; }
#fallback { display:none; flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); text-align:center; }
#fallback button { background:#14171F; border:1px solid var(--line); color:#8FF5C8; border-radius:12px; padding:11px 16px; font-family:inherit; font-size:12.5px; font-weight:800; width:100%; }
.ic { width:18px; height:18px; }
</style>
</head>
<body>
<div id="bar">
  <button onclick="location.href='index.html'"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div id="title">Lecture</div>
  <button onclick="App.share && App.share(CUR || location.href, document.getElementById('title').textContent)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg></button>
</div>
<div style="position:relative; flex:1; display:flex; min-height:0">
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <div id="status"><div class="spin"></div><div id="statusTxt">Recherche du meilleur serveur…</div><small>Le serveur répondant en premier est choisi automatiquement.</small></div>
</div>
<div id="fallback"><button id="fbBtn">Lecture bloquée ? Ouvrir la page directement</button></div>
<script>
const P = new URLSearchParams(location.search);
const T = P.get("t") || "Lecture";
const IMP = P.get("imdb") || "";
const TMP = P.get("tmdb") || "";
const S = P.get("s"), E = P.get("e");
const s = S === "" || S == null ? null : (+S);
const e = E === "" || E == null ? null : (+E);
document.getElementById("title").textContent = T;

const EMBEDS = [
  { name:"2Embed",     kind:"imdb", m:id=>"https://www.2embed.cc/embed/" + id,                       t:(id,a,b)=>"https://www.2embed.cc/embed/tv/" + id + "/" + a + "/" + b },
  { name:"MoviesAPI",  kind:"tmdb", m:id=>"https://moviesapi.to/movie/" + id,                        t:(id,a,b)=>"https://moviesapi.to/tv/" + id + "/" + a + "/" + b },
  { name:"SuperEmbed", kind:"imdb", m:id=>"https://multiembed.mov/?video_id=" + id,                  t:(id,a,b)=>"https://multiembed.mov/?video_id=" + id + "&s=" + a + "&e=" + b },
  { name:"VidSpark",   kind:"tmdb", m:id=>"https://vidspark.to/movie/" + id,                         t:(id,a,b)=>"https://vidspark.to/tv/" + id + "/" + a + "/" + b },
  { name:"VidFast",    kind:"tmdb", m:id=>"https://vidfast.vc/movie/" + id,                          t:(id,a,b)=>"https://vidfast.vc/tv/" + id + "/" + a + "/" + b },
  { name:"VidLink",    kind:"tmdb", m:id=>"https://vidlink.pro/movie/" + id,                         t:(id,a,b)=>"https://vidlink.pro/tv/" + id + "/" + a + "/" + b },
  { name:"VidSrc",     kind:"imdb", m:id=>"https://vidsrcapi.com/embed/movie/" + id,                 t:(id,a,b)=>"https://vidsrcapi.com/embed/tv/" + id + "/" + a + "/" + b },
];
let CUR = null;
let token = 0;
const cands = EMBEDS.filter(p => (p.kind === "imdb" ? IMP : TMP));
const urlFor = (p) => {
  const id = p.kind === "imdb" ? IMP : TMP;
  return s != null ? p.t(id, s, e) : p.m(id);
};
/* Les sites d'embed ne renvoient pas d'en-tête CORS : le navigateur ne peut pas les sonder
   directement. Sur le web, la sonde passe par notre propre serveur (même origine) :
   /probe/<url> → {status: n}. Dans l'app Android, la sonde est directe (pas de CORS). */
const PROBE_PREFIX = (typeof App !== "undefined" && App.platform && App.platform() === "web")
  ? location.origin + "/probe/"
  : "";
function probe(url, cb){
  App.fetch(PROBE_PREFIX ? PROBE_PREFIX + encodeURIComponent(url) : url, cb);
}

function setStatus(txt, sub){
  document.getElementById("status").style.display = "flex";
  document.getElementById("statusTxt").textContent = txt;
  if (sub != null) document.getElementById("status").querySelector("small").textContent = sub;
}
function win(url){
  token = -1;
  CUR = url;
  document.getElementById("frame").src = url;
  document.getElementById("status").style.display = "none";
}
function showFallback(label){
  document.getElementById("fallback").style.display = "block";
  const b = document.getElementById("fbBtn");
  b.textContent = label || "Lecture bloquée ? Ouvrir la page directement";
  b.onclick = () => { if (CUR) location.href = CUR; };
}
function tryServer(){
  if (!cands.length) {
    setStatus("Aucun serveur n'accepte ce titre.", "Ce titre n'a pas d'identifiant compatible (fréquent pour les animes rares). Relance, ou utilise un autre titre.");
    showFallback("Réessayer");
    document.getElementById("fbBtn").onclick = () => location.reload();
    return;
  }
  // Sonde tous les serveurs EN PARALLÈLE : le 1er à répondre part (gain de temps sur réseau lent)
  const tk = ++token;
  let settled = false;
  cands.forEach((p, i) => {
    const cb = "__chk" + tk + "_" + i;
    window[cb] = function(resp){
      if (tk !== token || settled) return;
      let st = resp.status;
      if (PROBE_PREFIX && st === 200) {
        try { st = JSON.parse(resp.body).status; } catch(e) { st = 0; }
      }
      if (st !== 200) return;
      settled = true;
      win(urlFor(p));
    };
    try { probe(urlFor(p), cb); } catch(err) {}
  });
  setStatus("Recherche du meilleur serveur…", cands.length + " serveurs sondés en parallèle.");
  // Personne n'a répondu en 8 s → on tente le 1er serveur directement dans l'iframe
  // (certains serveurs répondent mal aux sondes mais chargent bien en lecture).
  setTimeout(function(){
    if (tk !== token || settled) return;
    settled = true;
    win(urlFor(cands[0]));
    showFallback();
  }, 8000);
}
document.getElementById("fbBtn").onclick = () => { if (CUR) location.href = CUR; };
tryServer();
</script>
</body>
</html>
