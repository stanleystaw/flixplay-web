<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lecture</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{ --blue:#2166E5; --green:#1DD171; --bg:#0B0D12; --line:#232837; }
html,body{ height:100%; }
body { background:var(--bg); color:#fff; font-family:"Mulish","Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; }
#bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bg); border-bottom:1px solid var(--line); flex:0 0 auto; }
#bar button { background:#14171F; border:1px solid var(--line); color:#fff; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
#title { flex:1; font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#frame { flex:1; width:100%; border:none; background:#000; display:none; }
#vidwrap { flex:1; display:none; background:#000; }
#vid { width:100%; height:100%; background:#000; }
#status { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:12px; color:#C7CDD6; font-size:13.5px; font-weight:700; z-index:5; }
.spin { width:34px; height:34px; border:3px solid #2A3040; border-top-color:var(--green); border-radius:50%; animation:sp 1s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg);} }
#status small { color:#8A919C; font-weight:600; max-width:80%; text-align:center; line-height:1.5; }
#fallback { display:none; flex:0 0 auto; background:var(--bg); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); text-align:center; }
#fallback button { background:#14171F; border:1px solid var(--line); color:#8FF5C8; border-radius:12px; padding:11px 16px; font-family:inherit; font-size:12.5px; font-weight:800; width:100%; margin-top:6px; }
#fallback button:first-child { margin-top:0; color:#fff; }
.ic { width:18px; height:18px; }
</style>
</head>
<body>
<div id="bar">
  <button onclick="location.href='index.html'"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div id="title">Lecture</div>
  <button onclick="App.share && App.share(CUR || location.href, document.getElementById('title').textContent)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg></button>
</div>
<div style="position:relative; flex:1; display:flex; min-height:0">
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <div id="vidwrap"><video id="vid" controls playsinline autoplay></video></div>
  <div id="status"><div class="spin"></div><div id="statusTxt">Préparation de la lecture…</div><small>Le meilleur serveur est choisi automatiquement.</small></div>
  <button id="svNext" style="display:none;position:absolute;bottom:14px;right:14px;z-index:6;background:rgba(23,27,36,.94);color:#DDE3EC;border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)">Autre serveur</button>
  <button id="svExt" style="display:none;position:absolute;bottom:56px;right:14px;z-index:6;background:#2166E5;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)">Lecteur officiel</button>
</div>
<div id="fallback"></div>
<script src="hls.min.js"></script>
<script src="bridge.js"></script>
<script src="debuglog.js"></script>
<script>
const P = new URLSearchParams(location.search);
const T = P.get("t") || "Lecture";
const KIND = P.get("kind") || "film"; // film | serie | anime
const IMP = P.get("imdb") || "";
const TMP = P.get("tmdb") || "";
const S = P.get("s"), E = P.get("e");
const s = S === "" || S == null ? null : (+S);
const e = E === "" || E == null ? null : (+E);
const DIRECT = P.get("direct") || "";
const DKEY = P.get("directKind") || "";
const EXT = P.get("ext") || "";
const MAL = P.get("mal") || "";
document.getElementById("title").textContent = T;
if (window.FXLOG) FXLOG.log("INFO", "Lecteur : « " + T + " » kind=" + KIND + " imdb=" + (IMP || "-") + " mal=" + (MAL || "-") + (DIRECT ? " [FLUX DIRECT]" : ""));

let CUR = null;
let token = 0;

/* Les sites d'embed ne renvoient pas d'en-tête CORS : le navigateur ne peut pas les sonder
   directement. Sur le web, la sonde passe par notre propre serveur (même origine) :
   /probe/<url> → {status: n}. Dans l'app Android, la sonde est directe (pas de CORS). */
const PROBE_PREFIX = (typeof App !== "undefined" && App.platform && App.platform() === "web")
  ? location.origin + "/probe/"
  : "";
function probe(url, cb){
  App.fetch(PROBE_PREFIX ? PROBE_PREFIX + encodeURIComponent(url) : url, cb);
}
function setStatus(txt, sub){
  document.getElementById("status").style.display = "flex";
  document.getElementById("statusTxt").textContent = txt;
  if (sub != null) document.getElementById("status").querySelector("small").textContent = sub;
}
function hideStatus(){ document.getElementById("status").style.display = "none"; }
function addFallback(label, fn){
  const fb = document.getElementById("fallback");
  fb.style.display = "block";
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = fn;
  fb.appendChild(b);
}

/* ───────── Mode 1 : flux DIRECT (Internet Archive) — lecteur natif, 100 % fiable ───────── */
if (DIRECT) {
  setStatus("Lecture du flux direct…", "Flux Internet Archive — légal, sans intermédiaire.");
  const video = document.getElementById("vid");
  const vidwrap = document.getElementById("vidwrap");
  const frame = document.getElementById("frame");
  frame.style.display = "none";
  vidwrap.style.display = "block";
  CUR = DIRECT;
  let hls = null;
  const isHls = /\.m3u8(\?|$)/i.test(DIRECT) || DKEY === "hls";
  video.onerror = function(){
    hideStatus();
    addFallback("Flux indisponible ? Ouvrir la source", () => location.href = DIRECT);
  };
  video.onplaying = hideStatus;
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(DIRECT);
    hls.attachMedia(video);
  } else {
    video.src = DIRECT;
    const pr = video.play();
    if (pr && pr.catch) pr.catch(function(){});
  }
  setTimeout(function(){
    if (video.readyState < 2) setStatus("Chargement du flux…", "Le premier décodage peut prendre quelques secondes en 4G.");
  }, 6000);
}
/* ───────── Mode 2 : chaîne de serveurs de lecture (VidSrc en tête) ───────── */
else {
  const cands = [];
  if (KIND === "anime") {
    if (MAL) cands.push({ name:"VidSrc (ID)", url: "https://vidsrc.sh/embed/anime/mal/" + MAL });
    cands.push({ name:"VidSrc", url: "https://vidsrc.sh/embed/anime?q=" + encodeURIComponent(T) });
    if (IMP) cands.push({ name:"2Embed", url: "https://www.2embed.cc/embed/" + IMP });
  } else {
    if (KIND === "serie" && TMP && s != null) cands.push({ name:"VidSrc", url: "https://vidsrc.sh/embed/tv/" + TMP + "/" + s + "/" + (e || 1) });
    else if (IMP) cands.push({ name:"VidSrc", url: "https://vidsrc.sh/embed/movie/" + IMP });
    if (IMP) cands.push({ name:"2Embed", url: s != null ? "https://www.2embed.cc/embed/tv/" + IMP + "/" + s + "/" + (e || 1) : "https://www.2embed.cc/embed/" + IMP });
    if (TMP) cands.push({ name:"MoviesAPI", url: s != null ? "https://moviesapi.to/tv/" + TMP + "/" + s + "/" + (e || 1) : "https://moviesapi.to/movie/" + TMP });
    if (TMP) cands.push({ name:"VidSpark", url: s != null ? "https://vidspark.to/tv/" + TMP + "/" + s + "/" + (e || 1) : "https://vidspark.to/movie/" + TMP });
    if (TMP) cands.push({ name:"VidLink", url: s != null ? "https://vidlink.pro/tv/" + TMP + "/" + s + "/" + (e || 1) : "https://vidlink.pro/movie/" + TMP });
  }

  let curIdx = -1;
  function win(url, idx){
    token = -1;
    CUR = url;
    curIdx = (idx != null) ? idx : cands.findIndex(c => c.url === url);
    const nm = (cands[curIdx] && cands[curIdx].name) || "serveur";
    if (window.FXLOG) FXLOG.log("INFO", "Serveur choisi : " + nm + " : " + url);
    const frame = document.getElementById("frame");
    frame.style.display = "block";
    let loaded = false;
    if (frame.__onl) frame.removeEventListener("load", frame.__onl);
    frame.__onl = function(){
      if (frame.__cur !== url) return; // un autre serveur a pris la main entre-temps
      loaded = true;
      clearTimeout(frame.__t);
      if (window.FXLOG) FXLOG.log("INFO", "Iframe « " + nm + " » chargé — si rien ne joue, touche « Autre serveur »");
    };
    frame.__cur = url;
    frame.addEventListener("load", frame.__onl);
    // Iframe qui ne charge jamais (serveur mort ou bloqué) → passer au suivant
    clearTimeout(frame.__t);
    frame.__t = setTimeout(function(){
      if (loaded || CUR !== url) return;
      if (cands.length < 2) return;
      const ni = (curIdx + 1) % cands.length;
      if (window.FXLOG) FXLOG.log("API-KO", "Iframe « " + nm + " » n'a pas chargé en 20 s → " + cands[ni].name);
      win(cands[ni].url, ni);
    }, 20000);
    frame.src = url;
    // Bouton « Autre serveur » : bascule manuelle (ex. VidSrc vide/bloqué → 2Embed)
    const sv = document.getElementById("svNext");
    if (sv) {
      if (cands.length > 1) {
        sv.style.display = "block";
        sv.textContent = "Autre serveur (" + cands[(curIdx + 1) % cands.length].name + ")";
        sv.onclick = function(){
          const ni = (curIdx + 1) % cands.length;
          if (window.FXLOG) FXLOG.log("CLIQ", "Changement manuel de serveur → " + cands[ni].name);
          win(cands[ni].url, ni);
        };
      } else sv.style.display = "none";
    }
    const se = document.getElementById("svExt");
    if (se && EXT && !DIRECT) {
      se.style.display = "block";
      se.onclick = function(){
        if (window.FXLOG) FXLOG.log("NAV", "Lecteur officiel ouvert : " + EXT);
        window.open(EXT, "_blank", "noopener");
      };
    }
    hideStatus();
  }
  function tryServer(){
    if (!cands.length) {
      setStatus("Aucun serveur compatible pour ce titre.", "Utilise la recherche ou un autre titre (les animes rares ne sont pas toujours indexés).");
      addFallback("Réessayer", () => location.reload());
      if (EXT) addFallback("Lecteur officiel", () => location.href = EXT);
      return;
    }
    // Anime avec ID : les 2 formats VidSrc répondent 200 (shell JS) → pas de course,
    // on teste le format par ID d'abord, puis la recherche par titre.
    const sequential = (KIND === "anime" && MAL);
    const tk = ++token;
    let settled = false;
    function check(i){
      const p = cands[i];
      if (!p) return;
      const cb = "__chk" + tk + "_" + i;
      window[cb] = function(resp){
        if (tk !== token || settled) return;
        let st = resp.status;
        if (PROBE_PREFIX && st === 200) {
          try { st = JSON.parse(resp.body).status; } catch(err) { st = 0; }
        }
        if (window.FXLOG) FXLOG.log(st === 200 ? "API" : "API-KO", "Sonde " + p.name + " → " + st + " : " + p.url.slice(0, 90));
        if (st !== 200) { if (sequential) check(i + 1); return; }
        settled = true;
        win(p.url, i);
      };
      try { probe(p.url, cb); } catch(err) { if (sequential) check(i + 1); }
    }
    if (sequential) check(0);
    else cands.forEach((p, i) => check(i)); // EN PARALLÈLE : le 1er à répondre part
    setStatus("Recherche du meilleur serveur…", (sequential ? cands.length + " format(s) testé(s) dans l'ordre" : cands.length + " serveur(s) sondé(s) en parallèle") + ".");
    // Personne n'a répondu en 8 s → on tente le 1er serveur directement dans l'iframe
    setTimeout(function(){
      if (tk !== token || settled) return;
      settled = true;
      win(cands[0].url, 0);
      addFallback("Lecture bloquée ? Ouvrir la page directement", () => location.href = CUR);
      if (EXT) addFallback("Lecteur officiel", () => location.href = EXT);
    }, 8000);
  }
  tryServer();
}
</script>
</body>
</html>
