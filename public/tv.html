<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TV Direct</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{ --blue:#2166E5; --green:#1DD171; --bg:#0B0D12; --card:#14171F; --line:#232837; }
body { background:var(--bg); color:#fff; font-family:"Mulish","Segoe UI",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
#bar { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); border-bottom:1px solid var(--line); }
#bar .back { background:var(--card); border:1px solid var(--line); color:#fff; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
#ch { flex:1; font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#vidwrap { position:relative; flex:1; display:flex; min-height:0; }
#video { width:100%; height:100%; object-fit:contain; background:#000; }
#ctrls { display:flex; gap:8px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); }
#ctrls button { flex:1; background:var(--card); border:1px solid var(--line); color:#fff; border-radius:12px;
  padding:12px; font-size:13px; font-weight:800; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:7px; }
#ctrls button.primary { background:linear-gradient(90deg,var(--blue),var(--green)); border:none; color:#fff; }
#err { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:#14171FE6; border:1px solid var(--line); padding:18px 22px; border-radius:16px; font-size:13px; text-align:center; max-width:85%; line-height:1.6; font-weight:600; }
#loading { position:absolute; top:44%; left:50%; transform:translateX(-50%); color:#9AA0A6; font-size:13px; font-weight:700; display:flex; align-items:center; gap:10px; }
.spin { width:20px; height:20px; border:2.5px solid #2A3040; border-top-color:var(--green); border-radius:50%; animation:sp 1s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg);} }
.ic { width:16px; height:16px; }
</style>
</head>
<body>
<div id="bar">
  <button class="back" onclick="location.href='index.html'"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div id="ch">TV Direct</div>
</div>
<div id="vidwrap">
  <video id="video" controls playsinline autoplay></video>
  <div id="loading"><span class="spin"></span>Chargement du flux…</div>
  <div id="err"></div>
</div>
<div id="ctrls">
  <button class="primary" onclick="document.getElementById('video').play()"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>Lecture</button>
  <button onclick="copyUrl()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copier l'URL</button>
  <button onclick="App.share(SRC, CH)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg>Partager</button>
</div>
<script src="hls.min.js"></script>
<script>
const p = new URLSearchParams(location.search);
const SRC = p.get("u") || "";
const CH = p.get("n") || "Chaîne";
const LO = p.get("l") || "";
document.getElementById("ch").textContent = CH;
if (LO) { try { const l = new Image(); l.src = LO;
  l.onerror = () => l.remove();
  Object.assign(l, {style:"width:26px;height:26px;border-radius:6px;object-fit:cover;background:#222;flex:0 0 auto"});
  document.querySelector("#bar").insertBefore(l, document.getElementById("ch")); } catch(e){} }

const video = document.getElementById("video");
let hls = null;
function showError(msg){
  document.getElementById("loading").style.display = "none";
  const e = document.getElementById("err");
  e.style.display = "block";
  e.innerHTML = msg;
}
function hideLoading(){ document.getElementById("loading").style.display = "none"; }

if (!SRC) { showError("Aucune source fournie."); }
else if (window.Hls && Hls.isSupported()) {
  hls = new Hls({ maxBufferLength: 30 });
  hls.loadSource(SRC);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => { hideLoading(); video.play().catch(()=>{}); });
  hls.on(Hls.Events.ERROR, (ev, data) => {
    if (data.fatal) {
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        showError("Erreur réseau — la chaîne est peut-être hors ligne ou géo-bloquée.<br><small>" + (data.details || "") + "</small>");
        hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else showError("Flux illisible.");
    }
  });
} else {
  video.src = SRC;
  video.addEventListener("loadedmetadata", hideLoading);
  video.addEventListener("error", () => showError("Flux non lisible par le lecteur."));
}
function copyUrl(){
  try {
    const ta = document.createElement("textarea");
    ta.value = SRC; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    App.toast("URL copiée");
  } catch(e) { App.toast(SRC); }
}
</script>
</body>
</html>
